<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extract Thomas Photo</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #0F172A;
            color: #E2E8F0;
        }
        h1 {
            color: #22D3EE;
        }
        button {
            background: #8B5CF6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 20px 0;
        }
        button:hover {
            background: #7C3AED;
        }
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 12px;
            border-radius: 8px;
            background: #1E293B;
            color: #E2E8F0;
            border: 1px solid #334155;
            font-family: monospace;
            font-size: 12px;
        }
        .message {
            margin: 20px 0;
            padding: 12px;
            border-radius: 8px;
            background: #1E293B;
            border: 1px solid #334155;
        }
        .success {
            background: #064E3B;
            border-color: #10B981;
            color: #6EE7B7;
        }
        .error {
            background: #7F1D1D;
            border-color: #EF4444;
            color: #FCA5A5;
        }
        img {
            max-width: 200px;
            border-radius: 50%;
            margin: 20px 0;
            border: 4px solid #8B5CF6;
        }
    </style>
</head>
<body>
    <h1>📸 Extraction Photo Thomas</h1>
    <p>Cette page extrait la photo de Thomas depuis localStorage et l'affiche en base64.</p>
    
    <button id="extractButton">Extraire la Photo</button>
    
    <div id="preview"></div>
    
    <textarea id="photoBase64" readonly placeholder="La chaîne base64 apparaîtra ici..."></textarea>
    
    <div id="message"></div>

    <script>
        document.getElementById('extractButton').addEventListener('click', () => {
            const photoBase64 = localStorage.getItem('skillshield_thomas_photo');
            const textarea = document.getElementById('photoBase64');
            const message = document.getElementById('message');
            const preview = document.getElementById('preview');

            if (photoBase64) {
                textarea.value = photoBase64;
                
                // Afficher un aperçu
                preview.innerHTML = `
                    <h3>✅ Photo trouvée !</h3>
                    <img src="${photoBase64}" alt="Thomas Photo Preview" />
                    <p>La chaîne base64 a été copiée dans le champ ci-dessous.</p>
                `;
                
                message.className = 'message success';
                message.textContent = '✅ Photo extraite avec succès ! Copiez la chaîne base64 ci-dessus.';
                
                // Copier automatiquement dans le presse-papier
                navigator.clipboard.writeText(photoBase64).then(() => {
                    message.textContent = '✅ Photo extraite et copiée dans le presse-papier !';
                }).catch(err => {
                    console.error('Failed to copy:', err);
                    message.textContent = '✅ Photo extraite, mais impossible de copier automatiquement. Copiez manuellement.';
                });
            } else {
                preview.innerHTML = '';
                textarea.value = '';
                message.className = 'message error';
                message.textContent = '❌ Aucune photo trouvée dans localStorage avec la clé "skillshield_thomas_photo".';
            }
        });
    </script>
</body>
</html>
