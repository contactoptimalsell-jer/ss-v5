<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extract Thomas Photo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1e1e1e;
            color: #fff;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            background: #2d2d2d;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 0;
        }
        button:hover {
            background: #45a049;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background: #4CAF50;
            color: white;
        }
        .error {
            background: #f44336;
            color: white;
        }
        .info {
            background: #2196F3;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Extract Thomas's Photo from Local Storage</h1>
    <p>Cette page extrait la photo de Thomas depuis localStorage et la copie dans le presse-papiers.</p>
    
    <button id="extractButton">📸 Extraire la photo de Thomas</button>
    <button id="copyButton" style="display:none; background: #2196F3;">📋 Copier dans le presse-papiers</button>
    
    <div id="message"></div>
    
    <textarea id="photoBase64" readonly placeholder="La photo en base64 apparaîtra ici..."></textarea>
    
    <div id="preview" style="margin-top: 20px;"></div>

    <script>
        const extractButton = document.getElementById('extractButton');
        const copyButton = document.getElementById('copyButton');
        const photoBase64 = document.getElementById('photoBase64');
        const message = document.getElementById('message');
        const preview = document.getElementById('preview');

        extractButton.addEventListener('click', () => {
            try {
                const photoData = localStorage.getItem('skillshield_thomas_photo');
                
                if (photoData) {
                    photoBase64.value = photoData;
                    message.innerHTML = '<div class="message success">✅ Photo trouvée dans localStorage !</div>';
                    copyButton.style.display = 'block';
                    
                    // Afficher un aperçu
                    preview.innerHTML = '<h3>Aperçu de la photo :</h3><img src="' + photoData + '" style="max-width: 200px; border-radius: 8px; border: 2px solid #4CAF50;" />';
                } else {
                    photoBase64.value = '';
                    message.innerHTML = '<div class="message error">❌ Aucune photo trouvée dans localStorage avec la clé "skillshield_thomas_photo"</div>';
                    copyButton.style.display = 'none';
                    preview.innerHTML = '';
                }
            } catch (e) {
                message.innerHTML = '<div class="message error">❌ Erreur : ' + e.message + '</div>';
            }
        });

        copyButton.addEventListener('click', () => {
            if (photoBase64.value) {
                navigator.clipboard.writeText(photoBase64.value).then(() => {
                    message.innerHTML = '<div class="message success">✅ Photo copiée dans le presse-papiers !</div>';
                }).catch(err => {
                    message.innerHTML = '<div class="message error">❌ Erreur lors de la copie : ' + err.message + '</div>';
                });
            }
        });

        // Essayer d'extraire automatiquement au chargement
        window.addEventListener('load', () => {
            const photoData = localStorage.getItem('skillshield_thomas_photo');
            if (photoData) {
                message.innerHTML = '<div class="message info">💡 Photo détectée ! Cliquez sur "Extraire" pour l\'afficher.</div>';
            }
        });
    </script>
</body>
</html>
