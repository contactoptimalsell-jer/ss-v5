<!DOCTYPE html>
<html>
<head>
    <title>Convertir image en Base64</title>
</head>
<body>
    <h1>Convertir image en Base64 pour Thomas</h1>
    <input type="file" id="imageInput" accept="image/*">
    <div id="result" style="margin-top: 20px; word-break: break-all;"></div>
    
    <script>
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = function() {
                    const base64 = reader.result;
                    document.getElementById('result').innerHTML = 
                        '<p><strong>Photo en Base64 (copiez tout le texte ci-dessous) :</strong></p>' +
                        '<textarea style="width: 100%; height: 200px;">' + base64 + '</textarea>' +
                        '<button onclick="navigator.clipboard.writeText(\'' + base64 + '\').then(() => alert(\'Copié!\'))">Copier</button>';
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
